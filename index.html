<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Theatre | Seat selection</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#top">Campus Theatre</a>
    <a class="header-link" href="#top">Your cart <span id="header-count">0</span></a>
  </header>
  <main id="top" class="page-shell">
    <section class="intro"><h1>Choose your seats.</h1>
      <p>Explore the theatre, inspect a seat, then add it to your cart.</p>
    </section>
    <section class="ticketing-grid" aria-label="Venue map and ticket cart">
      <section class="venue-card" aria-labelledby="venue-heading">
        <div class="card-heading"><div><p class="eyebrow">THE VENUE</p><h2 id="venue-heading">Campus Theatre</h2></div>
          <p><strong>90</strong> seats · 3 sections</p></div>
        <p class="map-toolbar">Venue map</p>
        <div class="map-viewport" id="map-viewport"><div class="venue-layout" id="venue-layout">
          <div class="stage">STAGE</div><p class="map-placeholder">The venue layout will be added here.</p><div class="map-foot">MAIN ENTRANCE</div>
        </div></div>
        <p class="legend">Available · Inspected · In cart · Unavailable</p>
      </section>
      
    </section>
  </main>
</body>
</html>
